[package]
name = "printbetter"
description = "Print Better client: daemon, CLI, and tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["raster"]
raster = ["pb-print/raster"]
# StatusNotifierItem tray on Linux desktops (pure D-Bus, ~40 extra crates).
tray-linux = ["dep:ksni"]

[dependencies]
pb-print.workspace = true
tokio = { workspace = true, features = ["signal", "process"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
tokio-tungstenite.workspace = true
# Stream/Sink traits for the WebSocket; already in the graph via tokio-tungstenite.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
lexopt.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
# CGFloat-based APIs (statusItemWithLength) are gated on this feature; already in the lock graph.
objc2-app-kit = { workspace = true, features = ["objc2-core-foundation"] }
dispatch2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
