[workspace]
resolver = "3"
members = ["crates/print", "crates/app"]

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.92"
publish = false
authors = ["Ryan Yannelli"]
license = "MIT"
repository = "https://github.com/yannelli/print-better"
homepage = "https://github.com/yannelli/print-better"
readme = "../README.md"
keywords = ["printing", "ipp", "airprint", "cups", "print-server"]
categories = ["command-line-utilities", "network-programming", "hardware-support"]

[workspace.dependencies]
pb-print = { path = "crates/print", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros", "fs"] }
hyper = { version = "1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"
ring = "0.17.14"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
log = "0.4"
libc = "0.2"
mdns-sd = { version = "0.22.0", default-features = false, features = ["async"] }
nusb = "0.2.9"
hayro = "0.9.0"
png = "0.18.1"
zune-jpeg = "0.5.15"
miniz_oxide = "0.9.1"
lexopt = "0.3.2"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ksni = "0.3.7"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSButton", "NSControl", "NSView", "NSResponder", "NSImage", "NSRunningApplication"] }
dispatch2 = "0.3.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
